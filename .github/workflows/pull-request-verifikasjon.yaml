name: Verifiser at koden tilfredsstiller krav til Pull Request
on:
  pull_request:
    branches:
      - 'main'

jobs:
  verifiser:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Run prettier check
        run: npm run prettier:check
      - name: Run eslint check
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build app
        run: npm run build
